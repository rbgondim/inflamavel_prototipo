  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

);\">\n        <div><\u002Fdiv>\n        <div style=\"font-size:12px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.5);\">Inflamável — 2002 / 2024<\u002Fdiv>\n      <\u002Fdiv>\n      <nav style=\"margin:auto 0;display:flex;flex-direction:column;gap:clamp(2px,.5vh,10px);\">\n        <a href=\"index.html\" style=\"font-family:'Serial B Blur','Serial B';font-weight:700;font-size:clamp(44px,8.4vw,124px);line-height:1.04;letter-spacing:-.01em;color:#fff;text-decoration:none;width:fit-content;\" style-hover=\"background-image:var(--heat);background-size:cover;background-position:center;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:rgba(0,0,0,0);\">Home<\u002Fa>\n        <a href=\"galeria.html\" style=\"font-family:'Serial B Blur','Serial B';font-weight:700;font-size:clamp(44px,8.4vw,124px);line-height:1.04;letter-spacing:-.01em;color:#fff;text-decoration:none;width:fit-content;\" style-hover=\"background-image:var(--heat);background-size:cover;background-position:center;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:rgba(0,0,0,0);\">Projetos<\u002Fa>\n        <a href=\"#\" onclick=\"{{ toggleMenu }}\" style=\"font-family:'Serial B Blur','Serial B';font-weight:700;font-size:clamp(44px,8.4vw,124px);line-height:1.04;letter-spacing:-.01em;color:#fff;text-decoration:none;width:fit-content;\" style-hover=\"background-image:var(--heat);background-size:cover;background-position:center;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:rgba(0,0,0,0);\">Em Desenvolvimento<\u002Fa>\n        <a href=\"info.html\" style=\"font-family:'Serial B Blur','Serial B';font-weight:700;font-size:clamp(44px,8.4vw,124px);line-height:1.04;letter-spacing:-.01em;color:#fff;text-decoration:none;width:fit-content;\" style-hover=\"background-image:var(--heat);background-size:cover;background-position:center;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:rgba(0,0,0,0);\">Info<\u002Fa>\n      <\u002Fnav>\n      <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.55);\">\n        <div style=\"display:flex;gap:26px;\">\n          <a href=\"#\" style=\"color:rgba(255,255,255,.7);text-decoration:none;\" style-hover=\"color:#fff;\">Instagram<\u002Fa>\n          <a href=\"#\" style=\"color:rgba(255,255,255,.7);text-decoration:none;\" style-hover=\"color:#fff;\">Vimeo<\u002Fa>\n          <a href=\"#\" style=\"color:rgba(255,255,255,.7);text-decoration:none;\" style-hover=\"color:#fff;\">Contato<\u002Fa>\n        <\u002Fdiv>\n        <div>Ceará / Berlin<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;flowSpeed&quot;: {&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.2,&quot;max&quot;:2.5,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Menu&quot;}\n}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.state = { menuOpen:false, lang:'PT' };\n    this.toggleRef = React.createRef();\n    this.langRef = React.createRef();\n    this.headerRef = React.createRef();\n    this.raf = null; this._ly = 0;\n    this.loop = this.loop.bind(this);\n    this.SX = 2.2; this.SY = 2.2;\n    this.PALETTES = [[[0,[30,63,224]],[0.28,[92,134,245]],[0.5,[255,255,255]],[0.72,[236,75,153]],[1,[222,27,84]]],[[0,[198,160,255]],[0.32,[236,75,153]],[0.62,[229,32,58]],[1,[120,12,22]]],[[0,[247,244,230]],[0.3,[196,150,255]],[0.55,[124,58,237]],[0.8,[46,26,190]],[1,[12,8,44]]],[[0,[122,130,240]],[0.36,[255,112,92]],[0.62,[240,78,60]],[0.85,[150,92,220]],[1,[92,84,205]]],[[0,[16,7,22]],[0.3,[233,64,214]],[0.6,[214,238,150]],[0.85,[150,220,210]],[1,[120,200,214]]]];\n    this.RAMP = this.PALETTES[Math.floor(Math.random()*this.PALETTES.length)];\n  }\n  componentDidMount(){\n    this.hm = document.createElement('canvas'); this.hm.width = 80; this.hm.height = 80;\n    document.documentElement.style.setProperty('--heat','linear-gradient(90deg,#1E3FE0,#5C86F5,#FFFFFF,#EC4B99,#DE1B54)');\n    this.hmx = 0.5; this.hmy = 0.5;\n    this._hmove = (e)=>{ this.hmx = e.clientX/window.innerWidth; this.hmy = e.clientY/window.innerHeight; };\n    window.addEventListener('mousemove', this._hmove);\n    this._onScroll = ()=>{\n      const y = window.scrollY || 0;\n      const tr = (y > this._ly && y > 90 && !this.state.menuOpen) ? 'translateY(-115%)' : 'translateY(0)';\n      const h = this.headerRef.current; if(h) h.style.transform = tr;\n      const t = this.toggleRef.current; if(t && !this.state.menuOpen) t.style.transform = tr;\n      this._ly = y;\n    };\n    window.addEventListener('scroll', this._onScroll, {passive:true});\n    this.applyMenuIcon();\n    this.applyLang();\n    this.raf = requestAnimationFrame(this.loop);\n  }\n  componentDidUpdate(){ this.applyMenuIcon(); this.applyLang(); }\n  componentWillUnmount(){ cancelAnimationFrame(this.raf); window.removeEventListener('mousemove', this._hmove); window.removeEventListener('scroll', this._onScroll); }\n  toggleMenu(){ this.setState(s=>({menuOpen:!s.menuOpen})); }\n  setLang(l){ this.setState({lang:l}); }\n  applyLang(){ const el=this.langRef.current; if(!el) return; el.querySelectorAll('[data-lang]').forEach(b=>{ b.style.color = b.dataset.lang===this.state.lang ? '#fff' : 'rgba(255,255,255,.4)'; }); }\n  applyMenuIcon(){\n    const el=this.toggleRef.current; if(!el) return;\n    const open=this.state.menuOpen; const bars=el.querySelectorAll('[data-bar]'); const label=el.querySelector('[data-label]');\n    if(bars[0]){ bars[0].style.top = open?'5px':'0px'; bars[0].style.transform = open?'rotate(45deg)':'rotate(0deg)'; }\n    if(bars[1]){ bars[1].style.top = open?'5px':'10px'; bars[1].style.transform = open?'rotate(-45deg)':'rotate(0deg)'; }\n    if(label) label.textContent = open?'Fechar':'Menu';\n    if(open) el.style.transform = 'translateY(0)';\n  }\n  hash(xi,yi){ let h=(Math.imul(xi,374761393)+Math.imul(yi,668265263))|0; h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967295; }\n  noise(x,y){ const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi; const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf); const a=this.hash(xi,yi),b=this.hash(xi+1,yi),c=this.hash(xi,yi+1),d=this.hash(xi+1,yi+1); return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v; }\n  fbm(x,y){ let s=0,a=0.5,f=1; for(let i=0;i<3;i++){ s+=a*this.noise(x*f,y*f); f*=2; a*=0.5; } return s/0.875; }\n  shape(n){ let v=(n-0.30)/0.42; return v<0?0:v>1?1:v; }\n  field(x,y,t,mx,my){ const wx=this.fbm(x*0.9+t*0.06,y*0.9-t*0.045); const wy=this.fbm(x*0.9-t*0.05+5.2,y*0.9+t*0.05+1.7); const px=x+wx*1.8+(mx-0.5)*1.4; const py=y+wy*1.8+(my-0.5)*1.4; return this.fbm(px,py+t*0.03); }\n  rampColor(v){ const R=this.RAMP; if(v<0)v=0; if(v>1)v=1; for(let i=1;i<R.length;i++){ if(v<=R[i][0]){ const a=R[i-1],b=R[i],f=(v-a[0])/(b[0]-a[0]); return [a[1][0]+(b[1][0]-a[1][0])*f,a[1][1]+(b[1][1]-a[1][1])*f,a[1][2]+(b[1][2]-a[1][2])*f]; } } return R[R.length-1][1]; }\n  updateHeatVar(now){\n    if(now-(this._lastHeat||0)<55) return; this._lastHeat=now;\n    const cv=this.hm; if(!cv) return; const W=cv.width,H=cv.height; const ctx=cv.getContext('2d');\n    const t=(now/1000)*(this.props.flowSpeed??1); const mx=this.hmx??0.5,my=this.hmy??0.5;\n    const img=ctx.createImageData(W,H); const d=img.data;\n    for(let y=0;y<H;y++){ const fy=(y/H)*this.SY; for(let x=0;x<W;x++){ const n=this.field((x/W)*this.SX,fy,t,mx,my); const c=this.rampColor(this.shape(n)); const i=(y*W+x)*4; d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255; } }\n    ctx.putImageData(img,0,0);\n    document.documentElement.style.setProperty('--heat','url('+cv.toDataURL()+')');\n  }\n  loop(now){ if(this.state.menuOpen) this.updateHeatVar(now); this.raf=requestAnimationFrame(this.loop); }\n  renderVals(){\n    return {\n      menuOpen: this.state.menuOpen,\n      toggleMenu: ()=>this.toggleMenu(),\n      toggleRef: this.toggleRef,\n      langRef: this.langRef,\n      headerRef: this.headerRef,\n      onLang: (e)=>this.setLang(e.currentTarget.dataset.lang),\n      films: [\n        { year:'2002', title:'Madame Satã', type:'Longa', role:'Coprodução — Un Certain Regard, Cannes' },\n        { year:'2004', title:'Sertão de Acrílico Azul Piscina', type:'Doc. curta', role:'Coprodução' },\n        { year:'2006', title:'Love for Sale (Suely no Céu)', type:'Longa', role:'Coprodução — Orizzonti, Veneza' },\n        { year:'2010', title:'I Travel Because I Have To, I Come Back Because I Love You', type:'Longa', role:'Coprodução — Orizzonti, Veneza' },\n        { year:'2017', title:'Slate ANCINE — 5 longas + 2 séries', type:'Desenvolvimento', role:'Malibu · Cachoeira do Descuido · Lana Jaguaribe · Sem Vista Para o Mar' },\n        { year:'2019', title:'Nardjes A.', type:'Documentário', role:'Produção' },\n        { year:'2024', title:'Motel Destino', type:'Longa', role:'Cinema Inflamável + Gullane — competição, Cannes 2024' },\n        { year:'2025', title:'Rosebush Pruning', type:'Longa', role:'Em finalização — Elle Fanning, Pamela Anderson' },\n        { year:'2025', title:'Directors\\u2019 Factory Ceará Brasil', type:'4 curtas', role:'Abertura da Quinzena de Cineastas, Cannes 2025' },\n      ],\n      founders: [\n        { name:'Karim Aïnouz', role:'Diretor · Sócio-fundador', bio:'Cineasta cearense com trajetória internacional. Dirigiu Madame Satã (2002), Praia do Futuro (2014), A Vida Invisível (2019, Prêmio Un Certain Regard/Cannes), O Jogo da Rainha / Firebrand (2023) e Motel Destino (2024, competição em Cannes). Atualmente finaliza Rosebush Pruning, com Elle Fanning e Pamela Anderson. Em 2025, foi padrinho da Directors\\u2019 Factory Ceará Brasil na Quinzena de Cineastas de Cannes.' },\n        { name:'Janaina Bernardes', role:'Produtora · Sócia-fundadora', bio:'Produtora à frente da operação da Inflamável em Fortaleza. Lidera a produção de Motel Destino (com a Gullane) e a coprodução da Directors\\u2019 Factory Ceará Brasil (2025), parceria com a produtora francesa Dominique Welinski (DW), sediando pela primeira vez a América Latina na história do programa.' },\n      ],\n      marcos: [\n        { year:'1997', text:'Fundação da empresa em Fortaleza (registro CNPJ).' },\n        { year:'2017', text:'Apoio da ANCINE para um slate de 5 longas-metragens e 2 séries.' },\n        { year:'2024', text:'Motel Destino estreia em competição no Festival de Cannes.' },\n        { year:'2025', text:'Coprodução e sede da 10ª Directors\\u2019 Factory (Ceará–França), primeira vez do programa na América Latina; abertura da Quinzena de Cineastas em Cannes.' },\n      ],\n      legal: [\n        { label:'Razão social', value:'Cinema Inflamável Produções Cinematográficas LTDA' },\n        { label:'CNPJ', value:'02.174.031/0001-94' },\n        { label:'Natureza jurídica', value:'Sociedade Empresária Limitada' },\n        { label:'Fundação', value:'17/10/1997' },\n        { label:'CNAE principal', value:'59.11-1-99 — Produção cinematográfica, de vídeos e de TV' },\n        { label:'Situação cadastral', value:'Ativa' },\n        { label:'Endereço', value:'Rua Dr. Gilberto Studart, 55 — Sala 914, Torre Sul, Cocó — Fortaleza/CE — CEP 60192-105' },\n        { label:'Sócios-administradores', value:'Karim Aïnouz e Janaina Bernardes' },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
