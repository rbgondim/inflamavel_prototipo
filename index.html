<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inflamável — Cinema</title>
<meta name="description" content="Cinema Inflamável — produtora independente sediada em Fortaleza, focada em conteúdo original e autoral do Nordeste do Brasil para o público internacional.">
<link rel="icon" href="assets/img/logo-white.png">
<link rel="preload" href="assets/fonts/serial-b-700.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<div class="home">

  <div class="home__viewport">

    <!-- ======================= header ======================= -->
    <header class="site-header site-header--static">
      <a class="site-header__logo" href="index.html" aria-label="Inflamável — início">
        <canvas data-header-logo data-logo="assets/img/logo-white.png" width="3307" height="945"></canvas>
      </a>
      <div class="site-header__right">
        <nav class="nav">
          <a class="nav__link heat-text" href="projetos.html">Filmes</a>
          <a class="nav__link heat-text" href="#">Desenvolvimento</a>
          <a class="nav__link heat-text" href="info.html">Info</a>
        </nav>
        <div class="lang">
          <button class="lang__btn is-on" data-lang="PT" type="button">PT</button>
          <span class="lang__sep">/</span>
          <button class="lang__btn" data-lang="EN" type="button">EN</button>
        </div>
        <button class="menu-toggle" data-menu-toggle type="button" aria-expanded="false" aria-controls="menu">
          <span class="menu-toggle__bars" aria-hidden="true">
            <span class="menu-toggle__bar"></span>
            <span class="menu-toggle__bar"></span>
          </span>
          <span data-menu-label>Menu</span>
        </button>
      </div>
    </header>

    <!-- ======================= carrossel ======================= -->
    <section class="carousel" aria-label="Filmes em destaque">
      <div class="carousel__track">
        <div class="slide">
          <img class="slide__img" src="assets/img/madame-sata.jpg" alt="Madame Satã">
          <div class="slide__scrim-top"></div>
          <div class="slide__scrim-bottom"></div>
        </div>
        <div class="slide">
          <img class="slide__img" src="assets/img/ceu-de-suely.jpg" alt="O Céu de Suely">
          <div class="slide__scrim-top"></div>
          <div class="slide__scrim-bottom"></div>
        </div>
        <div class="slide">
          <img class="slide__img" src="assets/img/viajo-preciso.jpg" alt="Viajo Porque Preciso, Volto Porque Te Amo">
          <div class="slide__scrim-top"></div>
          <div class="slide__scrim-bottom"></div>
        </div>
        <div class="slide">
          <img class="slide__img" src="assets/img/praia-do-futuro.jpg" alt="Praia do Futuro">
          <div class="slide__scrim-top"></div>
          <div class="slide__scrim-bottom"></div>
        </div>
        <div class="slide">
          <img class="slide__img" src="assets/img/vida-invisivel.jpg" alt="A Vida Invisível">
          <div class="slide__scrim-top"></div>
          <div class="slide__scrim-bottom"></div>
        </div>
        <div class="slide">
          <img class="slide__img" src="assets/img/motel-destino3.jpg" alt="Motel Destino">
          <div class="slide__scrim-top"></div>
          <div class="slide__scrim-bottom"></div>
        </div>
      </div>

      <button class="scroll-cue" type="button" aria-label="Ver mais">
        <svg viewBox="0 0 44 24" fill="none" aria-hidden="true">
          <polyline points="4,5 22,19 40,5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
        </svg>
      </button>

      <div class="dots">
        <button class="dot is-on" data-i="0" type="button" aria-label="Ir para slide 1"></button>
        <button class="dot" data-i="1" type="button" aria-label="Ir para slide 2"></button>
        <button class="dot" data-i="2" type="button" aria-label="Ir para slide 3"></button>
        <button class="dot" data-i="3" type="button" aria-label="Ir para slide 4"></button>
        <button class="dot" data-i="4" type="button" aria-label="Ir para slide 5"></button>
        <button class="dot" data-i="5" type="button" aria-label="Ir para slide 6"></button>
      </div>
    </section>

  </div>

  <!-- ======================= footer ======================= -->
  <footer class="site-footer">
    <div class="site-footer__top">
      <div class="site-footer__mark">© Inflamável</div>
      <div class="site-footer__cols">
        <div class="site-footer__col">
          <div class="label label--sm">Navegação</div>
          <a class="site-footer__link" href="index.html">Home</a>
          <a class="site-footer__link" href="projetos.html">Projetos</a>
          <a class="site-footer__link" href="#">Em Desenvolvimento</a>
          <a class="site-footer__link" href="info.html">Info</a>
        </div>
        <div class="site-footer__col">
          <div class="label label--sm">Redes</div>
          <a class="site-footer__link" href="#">Instagram</a>
          <a class="site-footer__link" href="#">Vimeo</a>
          <a class="site-footer__link" href="#">Contato</a>
        </div>
      </div>
    </div>
    <div class="site-footer__legal">© INFLAMÁVEL 2026 — CEARÁ / BERLIN</div>
  </footer>

</div>

<!-- ======================= splash ======================= -->
<div class="splash">
  <canvas class="splash__bg" aria-hidden="true"></canvas>
  <div class="splash__grain" aria-hidden="true"></div>
  <canvas class="splash__logo" width="3307" height="945" role="button" tabindex="0" aria-label="Entrar no site"></canvas>
</div>

<!-- ======================= menu ======================= -->
<div class="menu" id="menu" hidden>
  <div class="menu__top">
    <button class="pill-btn" data-menu-toggle type="button">Fechar</button>
    <div class="label label--sm">Inflamável — 2002 / 2024</div>
  </div>
  <nav class="menu__nav">
    <a class="menu__link" href="index.html">Home</a>
    <a class="menu__link" href="projetos.html">Projetos</a>
    <a class="menu__link" href="#">Em Desenvolvimento</a>
    <a class="menu__link" href="info.html">Info</a>
  </nav>
  <div class="menu__foot">
    <div class="menu__social">
      <a href="#">Instagram</a>
      <a href="#">Vimeo</a>
      <a href="#">Contato</a>
    </div>
    <div>Ceará / Berlin</div>
  </div>
</div>

<script src="js/heat.js"></script>
<script src="js/nav.js"></script>
<script src="js/home.js"></script>
</body>
</html>
